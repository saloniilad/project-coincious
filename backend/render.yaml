services:
  - type: web
    name: coincious-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn backend.wsgi:application"
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure key
      - key: DEBUG
        value: "False"
      - key: MONGO_URI
        sync: false                  # You fill this in the Render dashboard
      - key: MONGO_DB_NAME
        value: coincious_db
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false                  # Your Vercel URL, e.g. https://myapp.vercel.app
      - key: RENDER_EXTERNAL_HOSTNAME
        fromService:
          name: coincious-backend
          type: web
          property: host